<!doctype html>
<html lang="ko">
<head>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1916" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도토리 가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>큩토리 부엌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#23211c; --muted2:#7a7466; --line:#e4dfd3;
  --accent:#2f6f5e; --accent-soft:#e3efe9; --danger:#b4513a; --warn:#c4862b;
  --h:#dfe6f5; --w:#fbefcf; --s:#ece9e1; --tomato:#e0654a; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1916; --panel:#22211d; --ink:#ece8de; --muted2:#a39d8f; --line:#38352e;
    --accent:#6fb59e; --accent-soft:#24362f; --danger:#e0876f; --h:#2a3247; --w:#3e3624; --s:#2d2b26; --tomato:#f08a70;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1100px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.02em}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:13px}
.switch a{padding:4px 12px;text-decoration:none;color:var(--muted2);cursor:pointer;white-space:nowrap}
.switch a.on{background:var(--ink);color:var(--bg);cursor:default}
.switch .more{display:none}
@media(max-width:600px){ .switch a:not(.on):not(.more){display:none} .switch.open a{display:inline-block !important} .switch .more{display:inline-block} .switch.open{flex-wrap:wrap;border-radius:14px} }
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e5484d;margin-left:4px;vertical-align:2px}
.top .sync{font-size:12px;color:var(--muted2);margin-left:auto}
nav{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav button.on{color:var(--ink);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 12px;font-weight:600}
.panel h2 small{font-weight:400;color:var(--muted2);margin-left:6px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted2)}
label.f > input,label.f > select,label.f > textarea{font-size:15px;color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
.form .wide{grid-column:1/-1}
.muted{color:var(--muted2);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted2)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--s);white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)} .tag.warn{background:#f6e3c4;color:#7a4f0e} .tag.bad{background:#f7d9d2;color:#8a2c1c}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 10px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button.on.low{background:var(--warn);color:#fff} .seg button.on.out{background:var(--danger);color:#fff}
.login{max-width:340px;margin:16vh auto;padding:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hero{background:linear-gradient(135deg,#fff1e6,#ffe0d6 60%,#fff4d6);border-radius:16px;padding:18px 20px;margin-bottom:16px;color:#23211c;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .big{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hero .em{font-size:44px}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.line:first-of-type{border-top:0}
.stock{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.stock:first-of-type{border-top:0}
.stock .nm{font-weight:600;cursor:pointer}
.stock.out .nm{color:var(--muted2);text-decoration:line-through}
@media(max-width:560px){ .stock{grid-template-columns:1fr auto} .stock .seg{grid-column:1/-1;justify-self:start} }
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .12s}
.rc:hover{transform:translateY(-2px)}
.rc .ph{height:120px;background:linear-gradient(135deg,#ffe3d6,#fff1c9);display:flex;align-items:center;justify-content:center;font-size:44px;background-size:cover;background-position:center}
.rc .bd{padding:10px 14px 12px}
.rc .t{font-weight:700}
.ing{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.ing:first-of-type{border-top:0}
.steps{margin:0;padding-left:22px}
.steps li{padding:5px 0}
.chk{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{width:19px;height:19px;accent-color:var(--accent)}
.chk.done span.n{text-decoration:line-through;color:var(--muted2)}
.chk span.n{flex:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:820px){ .week{grid-template-columns:1fr} }
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day .d{font-size:13px;font-weight:700;margin-bottom:6px}
.day textarea{font-size:14px;min-height:64px;background:var(--bg)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (Math.round(n)||0).toLocaleString('ko-KR');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
const pad = n => String(n).padStart(2,'0');
const fmtD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmtD(new Date());
const parseD = s => new Date(s + 'T00:00:00');
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const WD = ['일','월','화','수','목','금','토'];
const ymd = s => s ? `${s.slice(2,4)}.${+s.slice(5,7)}.${+s.slice(8)}` : '';
const md = s => s ? `${+s.slice(5,7)}/${+s.slice(8)}(${WD[parseD(s).getDay()]})` : '';

const PLACES = [['fridge','냉장','🧊'], ['freezer','냉동','❄️'], ['pantry','실온','🧺']];
const LEVELS = [['full','있음'], ['low','조금'], ['out','없음']];
const STAPLES = ['소금','설탕','후추','간장','진간장','국간장','양조간장','식용유','참기름','들기름','깨','통깨','물','고춧가루','고추장','된장','식초','맛술','미림','올리고당','물엿','다진마늘','밀가루','전분'];
const SHOP_KW = ['마트','이마트','홈플러스','롯데마트','코스트코','트레이더스','하나로','농협','컬리','쿠팡','오아시스','정육','청과','반찬','식자재','SSG'];
const DELIV_KW = ['배달의민족','배민','요기요','쿠팡이츠','땡겨요'];
const TAGS = ['한식','양식','중식','일식','국·찌개','반찬','면','밥','고기','해산물','간단','손님용','다이어트','간식'];

const S = { recs:null, view:'home', edit:null, open:null, place:'all', tag:'', q:'', toto:false, week:null };
const CFG = window.GAGYEBU_CONFIG || {};
const sb = (CFG.supabaseUrl && window.supabase) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
const items = () => S.recs.filter(r => r.kind === 'item');
const recipes = () => S.recs.filter(r => r.kind === 'recipe');
const shops = () => S.recs.filter(r => r.kind === 'shop');
function cfg(){ let c = S.recs.find(r => r.kind === 'cfg'); if (!c) { c = {id:'cfg', kind:'cfg'}; S.recs.push(c); }
  c.staples = c.staples || STAPLES.slice(); c.shopKw = c.shopKw || SHOP_KW.slice(); c.delivKw = c.delivKw || DELIV_KW.slice(); return c; }

// 재료 이름 맞추기: 띄어쓰기 무시, 한쪽이 다른 쪽을 포함하면 같은 재료로 봐요 (예: '대파' ↔ '대파 반 단')
const norm = s => String(s || '').replace(/\s+/g, '').replace(/\(.*?\)/g, '').toLowerCase();
const same = (a, b) => { a = norm(a); b = norm(b); return !!a && !!b && (a === b || (a.length >= 2 && b.includes(a)) || (b.length >= 2 && a.includes(b))); };
const findItem = name => items().find(i => same(i.name, name));
// 양념은 재료 이름이 양념 이름을 포함할 때만 (예: '양조간장'→간장 O, '마늘'→다진마늘 X)
const isStaple = name => cfg().staples.some(s => norm(s) && norm(name).includes(norm(s)));
function have(name){ if (isStaple(name)) return 'staple'; const it = findItem(name); return it && it.level !== 'out' ? it.level : null; }
function analyze(r){
  const ings = (r.ings || []).filter(g => !g.opt);
  const miss = ings.filter(g => !have(g.name));
  const urgent = ings.map(g => findItem(g.name)).filter(it => it && it.level !== 'out' && it.exp && diffDays(today(), it.exp) <= 3);
  return {miss, urgent, total:ings.length};
}
function expTag(it){ if (!it.exp) return ''; const n = diffDays(today(), it.exp);
  return `<span class="tag ${n < 0 ? 'bad' : n <= 3 ? 'warn' : ''}">${n < 0 ? `${-n}일 지남` : n === 0 ? '오늘까지' : `D-${n}`}</span>`; }
// "돼지고기 300g" → {name:'돼지고기', amount:'300g'}
function parseIng(line){
  const s = line.trim().replace(/^[-•·*]\s*/, ''); if (!s) return null;
  const opt = /\(선택\)|선택\s*$/.test(s);
  const m = s.match(/^(.+?)\s+((?:\d|½|¼|¾|한|두|세|반|약간|적당|조금|1\/|한줌|톡).*)$/);
  return {name:(m ? m[1] : s).replace(/\(선택\)/,'').trim(), amount:(m ? m[2] : '').replace(/\(선택\)/,'').trim(), opt};
}

// ---------- 저장소 ----------
function check(res){ if (res.error) { if (/JWT|auth/i.test(res.error.message)) { S.recs = null; renderLogin(); throw new Error('login'); } throw new Error(res.error.message); } return res.data; }
async function fetchRecs(){
  const rows = []; for (let off = 0; ; off += 1000) {
    const res = await sb.from('kitchen').select('id,data').order('id').range(off, off + 999);
    if (res.error && /kitchen/.test(res.error.message) && !/JWT/.test(res.error.message)) {
      $('#app').innerHTML = `<div class="panel login"><h2>한 번만 설정이 필요해요</h2><p class="muted">Supabase <b>SQL Editor</b>에서 <code>kitchen_schema.sql</code> 내용을 붙여넣고 Run 해주세요. 그다음 새로고침하면 돼요.</p></div>`;
      throw new Error('setup'); }
    const part = check(res); rows.push(...part.map(r => r.data)); if (part.length < 1000) break; }
  return rows;
}
async function load(){
  const { data:{ session } } = await sb.auth.getSession();
  S.toto = (session?.user?.email || '').toLowerCase() === 'tksid1@gmail.com';
  S.recs = await fetchRecs(); S.syncedAt = new Date(); render(); carDot();
}
async function carDot(){ try { const r = await sb.from('car').select('data').eq('id','status').maybeSingle(); const n = r.data && r.data.data && r.data.data.count || 0;
  if (!!n !== !!S.carDot) { S.carDot = n; render(); } } catch(e){} }
async function saveMany(list, msg){
  try { const now = new Date().toISOString();
    check(await sb.from('kitchen').upsert(list.map(rec => { rec.updatedAt = now; return {id:rec.id, data:rec, updated_at:now}; })));
    S.selfWrite = Date.now(); S.syncedAt = new Date();
    list.forEach(rec => { const i = S.recs.findIndex(x => x.id === rec.id); if (i >= 0) S.recs[i] = rec; else S.recs.push(rec); });
    render(); if (msg) toast(msg); return true;
  } catch(e){ if (e.message !== 'login') toast('저장 실패: ' + e.message); return false; }
}
const save = (rec, msg) => saveMany([rec], msg);
async function remove(ids, msg){
  ids = [].concat(ids);
  try { check(await sb.from('kitchen').delete().in('id', ids)); S.selfWrite = Date.now(); S.recs = S.recs.filter(r => !ids.includes(r.id)); render(); toast(msg || '삭제했어요'); }
  catch(e){ if (e.message !== 'login') toast('삭제 실패: ' + e.message); }
}
function subscribe(){
  if (S.channel) return;
  S.channel = sb.channel('kitchen').on('postgres_changes', {event:'*', schema:'public', table:'kitchen'}, () => {
    if (S.selfWrite && Date.now() - S.selfWrite < 3000) return; clearTimeout(S._rt); S._rt = setTimeout(pull, 700); }).subscribe();
}
async function pull(){
  if (S.edit || document.activeElement?.matches('input:not([type=checkbox]),textarea,select')) { S.pending = true; return; }
  try { S.recs = await fetchRecs(); S.pending = false; S.syncedAt = new Date(); render(); } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.recs) pull(); });

// ---------- 화면 ----------
function renderLogin(){
  $('#app').innerHTML = `<div class="panel login"><h2>큩토리 부엌</h2>
    <form id="lf" style="display:grid;gap:12px"><label class="f">이메일<input type="email" id="em" autocomplete="username" autofocus></label>
    <label class="f">비밀번호<input type="password" id="pw" autocomplete="current-password"></label>
    <button class="btn pri">들어가기</button><div class="muted" id="lerr"></div></form><p class="muted">가계부와 같은 계정이에요.</p></div>`;
  $('#lf').onsubmit = async ev => { ev.preventDefault();
    const r = await sb.auth.signInWithPassword({email: $('#em').value.trim(), password: $('#pw').value});
    if (r.error) return $('#lerr').textContent = '이메일 또는 비밀번호가 맞지 않아요';
    try { await load(); subscribe(); } catch(e){ if (e.message !== 'setup') $('#lerr').textContent = e.message; } };
}
function render(){
  if (!S.recs) return renderLogin();
  const nShop = shops().filter(s => !s.done).length;
  const tabs = [['home','오늘 뭐 먹지'],['stock','냉장고'],['recipe','레시피'],['shop',`장보기${nShop ? ` <span class="tag">${nShop}</span>` : ''}`],['plan','식단']];
  $('#app').innerHTML = `<header><div class="top"><h1>🍳 큩토리 부엌</h1>
      <span class="switch"><a href="index.html">가계부</a><a href="travel.html">여행</a><a href="health.html">건강</a><a href="car.html">다람이${S.carDot?'<i class="dot"></i>':''}</a><a class="on">큩토리 부엌</a>${S.toto ? '<a href="toto.html" title="따로 로그인">도토리 방앗간</a>' : ''}<a class="more" onclick="this.parentNode.classList.toggle('open')">▾${S.carDot?'<i class="dot"></i>':''}</a></span>
      <span class="sync">${S.syncedAt ? '동기화 ' + S.syncedAt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : ''} · <a href="#" id="logout">로그아웃</a></span></div>
    <nav>${tabs.map(([k,l]) => `<button data-v="${k}" class="${S.view===k?'on':''}">${l}</button>`).join('')}</nav></header><main id="main"></main>`;
  $('#logout').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.href = 'index.html'; };
  $$('nav button').forEach(b => b.onclick = () => { S.view = b.dataset.v; S.edit = null; S.open = null; if (S.pending) pull(); render(); window.scrollTo(0,0); });
  ({home:viewHome, stock:viewStock, recipe:viewRecipe, shop:viewShop, plan:viewPlan})[S.view]();
}
const placeOf = k => PLACES.find(p => p[0] === k) || PLACES[0];

// ----- 오늘 뭐 먹지 -----
function viewHome(){
  const exp = items().filter(i => i.level !== 'out' && i.exp && diffDays(today(), i.exp) <= 3).sort((a,b) => a.exp.localeCompare(b.exp));
  const rs = recipes().map(r => ({r, ...analyze(r)})).filter(x => x.total);
  const ready = rs.filter(x => !x.miss.length).sort((a,b) => b.urgent.length - a.urgent.length || (a.r.lastCooked||'').localeCompare(b.r.lastCooked||''));
  const near = rs.filter(x => x.miss.length && x.miss.length <= 2).sort((a,b) => a.miss.length - b.miss.length || b.urgent.length - a.urgent.length);
  const plan = S.recs.find(r => r.id === 'plan-' + today());
  const card = x => `<div class="line"><div><a href="#" data-ro="${x.r.id}" style="font-weight:600;text-decoration:none">${esc(x.r.name)}</a>
      ${x.urgent.length ? ` <span class="tag warn">${esc(x.urgent.map(i => i.name).join('·'))} 먼저 쓰기</span>` : ''}
      <div class="muted">${x.miss.length ? '없는 재료: ' + esc(x.miss.map(g => g.name).join(', ')) : `${x.r.time ? x.r.time + '분 · ' : ''}${x.r.lastCooked ? '마지막 ' + ymd(x.r.lastCooked) : '아직 안 해 먹음'}`}</div></div>

function addMissing(r){
  const miss = analyze(r).miss; const cur = shops().filter(s => !s.done);
  const add = miss.filter(g => !cur.some(s => same(s.name, g.name))).map(g => ({id:uid(), kind:'shop', name:g.name, amount:g.amount || '', done:false, from:r.name}));
  if (!add.length) return toast('없는 재료는 이미 장보기 목록에 있어요');
  saveMany(add, `${add.map(a => a.name).join(', ')}을(를) 장보기에 담았어요`);
}

function newRecipe(){ S.open = null; S.edit = {_recipe:true, name:'', link:'', photo:'', serves:2, time:'', tags:[], ings:[], steps:'', memo:''}; render(); }

  const q = norm(S.q);

      <div style="margin-top:6px">${x.miss.length ? `<span class="tag">${x.miss.length}개 없음</span>` : '<span class="tag ok">지금 만들 수 있어요</span>'} ${x.urgent.length ? '<span class="tag warn">임박 재료</span>' : ''}</div></div></div>`).join('')}</div>`
      : `<div class="panel empty">${recipes().length ? '찾는 레시피가 없어요' : '자주 해 먹는 요리를 등록해 보세요.<br>유튜브·블로그 링크만 넣어 둬도 돼요.'}</div>`}`;

function cookForm(){

  };
}

      <textarea name="ings" rows="10" placeholder="돼지고기 앞다리 200g&#10;김치 1/4포기&#10;두부 반 모&#10;대파 1대&#10;고춧가루 1큰술&#10;청양고추 1개 (선택)">${esc((e.ings||[]).map(g => [g.name, g.amount].filter(Boolean).join(' ') + (g.opt ? ' (선택)' : '')).join('\n'))}</textarea>
      <p class="muted">"(선택)"을 붙이면 없어도 만들 수 있는 재료로 봐요.</p></div>
    <div class="panel"><h2>만드는 법 <small>한 줄에 한 단계</small></h2>
      <textarea name="steps" rows="10" placeholder="냄비에 돼지고기와 김치를 볶는다&#10;물 500ml를 붓고 끓인다&#10;두부, 대파를 넣고 5분 더 끓인다">${esc(e.steps)}</textarea></div></div>
    <div class="panel"><label class="f">메모<textarea name="memo" rows="2" placeholder="예: 동현은 덜 맵게">${esc(e.memo)}</textarea></label></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="rcancel">취소</button><button class="btn pri">저장</button></div></form>`;
  const f = $('#rf');
  $$('[data-t]').forEach(b => b.onclick = () => { const t = b.dataset.t; e.tags = (e.tags||[]).includes(t) ? e.tags.filter(x => x !== t) : [...(e.tags||[]), t]; b.classList.toggle('on'); });
  $('#rcancel').onclick = () => { S.edit = null; render(); };
  f.onsubmit = ev => { ev.preventDefault();
    const rec = {...e, id:e.id || uid(), kind:'recipe', name:f.name.value.trim(), serves:+f.serves.value || '', time:+f.time.value || '', link:f.link.value.trim(), photo:f.photo.value.trim(),
      tags:e.tags || [], ings:f.ings.value.split('\n').map(parseIng).filter(Boolean), steps:f.steps.value.trim(), memo:f.memo.value.trim()};
    delete rec._recipe; S.edit = null; S.open = rec.id; save(rec, '레시피를 저장했어요'); };
}

// ----- 장보기 -----
async function loadLedger(){
  const m = today().slice(0,7), key = m; if (S.ledger && S.ledger.key === key) return;
  S.ledger = {key, rows:null};
  try { const rows = []; for (let off = 0; ; off += 1000) {
      const part = check(await sb.from('items').select('data').eq('col','entries').gte('data->>date', m + '-01').lte('data->>date', m + '-31').range(off, off + 999));
      rows.push(...part.map(r => r.data)); if (part.length < 1000) break; }
    S.ledger = {key, rows: rows.filter(x => x.type === 'expense')}; } catch(e){ S.ledger = {key, rows:[], err:e.message}; }
  if (S.view === 'shop') render();
}
function viewShop(){
  loadLedger(); const c = cfg();
  const todo = shops().filter(s => !s.done).sort((a,b) => (a.from||'').localeCompare(b.from||'') || a.name.localeCompare(b.name)), done = shops().filter(s => s.done);
  const L = S.ledger || {}; const hit = kw => (L.rows||[]).filter(x => kw.some(k => k && (x.detail||'').toUpperCase().includes(k.toUpperCase())));
  const groc = hit(c.shopKw), deliv = hit(c.delivKw);
  $('#main').innerHTML = `<form id="sf" class="panel row" style="gap:8px"><input id="sn" placeholder="살 것 (쉼표로 여러 개: 우유, 계란 한 판)" style="flex:1;min-width:200px"><button class="btn pri">담기</button></form>
    <div class="panel"><h2>🛒 살 것 <small>${todo.length}개 · 체크하면 냉장고에 들어가요</small></h2>
      ${todo.length ? todo.map(s => `<label class="chk"><input type="checkbox" data-sd="${s.id}"><span class="n"><b>${esc(s.name)}</b> ${s.amount ? `<span class="muted">${esc(s.amount)}</span>` : ''}</span>
        ${s.from ? `<span class="tag">${esc(s.from)}</span>` : ''}<button type="button" class="btn sm ghost danger" data-sx="${s.id}">×</button></label>`).join('') : '<div class="muted">살 게 없어요 👍</div>'}</div>
    ${done.length ? `<div class="panel"><div class="row between"><h2 style="margin:0">산 것 <small>${done.length}개</small></h2><button class="btn sm" id="sclr">목록에서 지우기</button></div>
      ${done.map(s => `<label class="chk done"><input type="checkbox" checked data-su="${s.id}"><span class="n">${esc(s.name)}</span></label>`).join('')}</div>` : ''}
    <div class="panel"><h2>💳 이번 달 식비 <small>가계부 내역을 가맹점 이름으로 찾았어요</small></h2>
      ${!L.rows ? '<div class="muted">불러오는 중…</div>' : `<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
        <div><div class="muted">장보기 (${groc.length}건)</div><div style="font-size:22px;font-weight:700" class="num">${won(groc.reduce((a,x) => a + +x.amount, 0))}원</div></div>
        <div><div class="muted">배달 (${deliv.length}건)</div><div style="font-size:22px;font-weight:700" class="num">${won(deliv.reduce((a,x) => a + +x.amount, 0))}원</div></div></div>
        <details style="margin-top:10px"><summary class="muted" style="cursor:pointer">가맹점 키워드 바꾸기</summary>
          <label class="f" style="margin-top:8px">장보기<input id="kw1" value="${esc(c.shopKw.join(', '))}"></label><label class="f" style="margin-top:6px">배달<input id="kw2" value="${esc(c.delivKw.join(', '))}"></label>
          <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn sm" id="kws">저장</button></div></details>`}</div>`;
  $('#sf').onsubmit = ev => { ev.preventDefault(); const names = $('#sn').value.split(/[,，\n]/).map(s => s.trim()).filter(Boolean); if (!names.length) return;
    saveMany(names.map(n => { const p = parseIng(n); return {id:uid(), kind:'shop', name:p.name, amount:p.amount, done:false, from:''}; }), '담았어요').then(() => $('#sn') && $('#sn').focus()); };
  $$('[data-sd]').forEach(cb => cb.onchange = () => { const s = shops().find(x => x.id === cb.dataset.sd), ex = findItem(s.name);
    const it = ex ? {...ex, level:'full'} : {id:uid(), kind:'item', name:s.name, place:'fridge', level:'full', count:s.amount || '', exp:'', memo:''};
    saveMany([{...s, done:true}, it], `${s.name} → ${placeOf(it.place)[1]}에 넣었어요`); });
  $$('[data-su]').forEach(cb => cb.onchange = () => { const s = shops().find(x => x.id === cb.dataset.su); save({...s, done:false}); });
  $$('[data-sx]').forEach(b => b.onclick = ev => { ev.preventDefault(); remove(b.dataset.sx, '뺐어요'); });
  if ($('#sclr')) $('#sclr').onclick = () => remove(done.map(s => s.id), '산 것을 목록에서 지웠어요');
  if ($('#kws')) $('#kws').onclick = () => { c.shopKw = $('#kw1').value.split(',').map(s => s.trim()).filter(Boolean); c.delivKw = $('#kw2').value.split(',').map(s => s.trim()).filter(Boolean); save(c, '키워드를 저장했어요'); };
}

// ----- 식단 -----
function viewPlan(){
  if (!S.week) { const d = parseD(today()); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); S.week = fmtD(d); }
  const days = Array.from({length:7}, (_, i) => addDays(S.week, i));
  const names = recipes().map(r => r.name);
  $('#main').innerHTML = `<div class="row between" style="margin-bottom:12px"><div class="row" style="gap:6px"><button class="btn sm" id="wp">◀</button><b>${md(days[0])} ~ ${md(days[6])}</b><button class="btn sm" id="wn">▶</button><button class="btn sm ghost" id="wt">이번 주</button></div>
      <span class="muted">적고 나서 칸 밖을 누르면 저장돼요</span></div>
    <div class="week">${days.map(d => { const p = S.recs.find(r => r.id === 'plan-' + d); const rs = recipes().filter(r => p && p.text && p.text.split(/\n|,/).some(t => norm(t) && norm(t) === norm(r.name)));
      return `<div class="day ${d === today() ? 'today' : ''}"><div class="d">${WD[parseD(d).getDay()]} ${+d.slice(5,7)}/${+d.slice(8)}</div>
        <textarea data-pd="${d}" placeholder="저녁 메뉴">${esc(p ? p.text : '')}</textarea>
        ${rs.map(r => `<a href="#" data-ro="${r.id}" class="tag ok" style="text-decoration:none;margin-top:4px">${esc(r.name)} 보기</a>`).join(' ')}</div>`; }).join('')}</div>
    ${names.length ? `<div class="panel" style="margin-top:16px"><h2>레시피에서 고르기 <small>누르면 오늘 칸에 들어가요</small></h2><div class="chips">${names.map(n => `<button class="chip" data-pick="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>` : ''}`;
  $('#wp').onclick = () => { S.week = addDays(S.week, -7); render(); }; $('#wn').onclick = () => { S.week = addDays(S.week, 7); render(); }; $('#wt').onclick = () => { S.week = null; render(); };
  const savePlan = (d, text) => { const id = 'plan-' + d, old = S.recs.find(r => r.id === id); if ((old ? old.text : '') === text) return;
    if (!text && old) return remove(id, '지웠어요'); save({id, kind:'plan', date:d, text}, `${md(d)} 식단을 저장했어요`); };
  $$('[data-pd]').forEach(t => t.onblur = () => savePlan(t.dataset.pd, t.value.trim()));
  $$('[data-pick]').forEach(b => b.onclick = () => { const d = days.includes(today()) ? today() : days[0]; const old = S.recs.find(r => r.id === 'plan-' + d);
    savePlan(d, [old && old.text, b.dataset.pick].filter(Boolean).join('\n')); });
  $$('[data-ro]').forEach(a => a.onclick = e => { e.preventDefault(); S.view = 'recipe'; S.open = a.dataset.ro; render(); });
}

(async () => {
  if (!sb) { $('#app').innerHTML = `<div class="panel login"><h2>설정이 필요해요</h2><p class="muted">config.js에 Supabase 주소와 키를 넣어주세요.</p></div>`; return; }
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  try { await load(); subscribe(); }
  catch(e){ if (e.message !== 'login' && e.message !== 'setup') $('#app').innerHTML = `<div class="panel login">DB에 연결할 수 없어요: ${esc(e.message)}</div>`; }
})();
</script>
