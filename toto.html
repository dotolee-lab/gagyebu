<!doctype html>
<html lang="ko">
<head>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1916" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도토리 가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도토리 방앗간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#23211c; --muted2:#7a7466; --line:#e4dfd3; --s:#ece9e1;
  --accent:#3d5f99; --accent-soft:#e3e9f5; --win:#2f6f5e; --lose:#b4513a; --wait:#c4862b; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1916; --panel:#22211d; --ink:#ece8de; --muted2:#a39d8f; --line:#38352e; --s:#2d2b26;
    --accent:#8fa9dc; --accent-soft:#26304a; --win:#6fb59e; --lose:#e0876f; --wait:#e0b060;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1180px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.02em}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:13px}
.switch a{padding:4px 12px;text-decoration:none;color:var(--muted2)}
.switch a.on{background:var(--ink);color:var(--bg)}
.top .sync{font-size:12px;color:var(--muted2);margin-left:auto}
nav{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav button.on{color:var(--ink);border-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 12px;font-weight:600}
.panel h2 small{font-weight:400;color:var(--muted2);margin-left:6px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted2)} .kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums} .kpi .s{font-size:12px;color:var(--muted2)}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 8px;font-size:13px} .btn.ghost{border-color:transparent;background:none} .btn.danger{color:var(--lose)}
input,select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;min-width:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted2)}
label.f > input,label.f > select{font-size:15px;color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:14px;word-break:keep-all}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted2);white-space:nowrap}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--s);white-space:nowrap}
.tag.win{background:color-mix(in srgb,var(--win) 22%,transparent);color:var(--win)}
.tag.lose{background:color-mix(in srgb,var(--lose) 18%,transparent);color:var(--lose)}
.tag.wait{background:color-mix(in srgb,var(--wait) 22%,transparent);color:var(--wait)}
.plus{color:var(--win)} .minus{color:var(--lose)}
.muted{color:var(--muted2);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted2)}
.bar{height:8px;border-radius:99px;background:var(--s);overflow:hidden} .bar>i{display:block;height:100%;background:var(--accent)} .bar.over>i{background:var(--lose)}
.login{max-width:360px;margin:14vh auto;padding:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
svg text{fill:var(--muted2);font-size:11px}
.mlist{display:none}
@media(max-width:700px){ .pc-only{display:none !important} .mlist{display:block} }
.mcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.mcard.win{border-left-color:var(--win)} .mcard.lose{border-left-color:var(--lose)} .mcard.wait{border-left-color:var(--wait)}
.mrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mt{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msub{font-size:12.5px;color:var(--muted2);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.mact{display:flex;justify-content:flex-end;gap:2px;margin-top:4px} .mact .btn{padding:2px 8px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 10px;font-size:13px;background:var(--bg)}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted2);padding:0 4px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
'use strict';
const RESULTS = {wait:'대기', win:'적중', lose:'미적중', refund:'적특·환불'};
const DEFAULTS = {games:['프로토 승부식','프로토 기록식','축구토토 승무패','야구토토','농구토토','배구토토','기타'], monthlyLimit:0};
const S = {data:null, view:'list', month:null, year:null, edit:null, f:{res:'all', game:'all'},
  g:{league:'EPL', date:null, mode:'games', open:null}, n:{league:'EPL', mode:'news', tag:'all', q:''}, sc:new Map(), autoDone:false};
const LEAGUES = {EPL:'EPL', LALIGA:'라리가', BUNDES:'분데스', SERIEA:'세리에A', LIGUE1:'리그1', MLB:'MLB', KBO:'KBO', NBA:'NBA'};
const SPORT = l => ['MLB','KBO'].includes(l) ? 'baseball' : l === 'NBA' ? 'basketball' : 'soccer';
const PICKS = {'':'선택 안 함 (자동 판정 안 함)', home:'홈 승', draw:'무승부', away:'원정 승'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (Math.round(n)||0).toLocaleString('ko-KR');
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + won(Math.abs(n));
const pm = n => n > 0 ? 'plus' : n < 0 ? 'minus' : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const ym = (y, m) => `${y}-${String(m).padStart(2,'0')}`;
const shiftMonth = (s, k) => { let [y,m] = s.split('-').map(Number); m += k; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return ym(y,m); };
const monthLabel = s => { const [y,m] = s.split('-'); return `${y}년 ${+m}월`; };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }

// ---------- 저장소: 가계부와 같은 Supabase, 다른 테이블 + 따로 로그인 (로그인 상태 저장 안 함) ----------
const CFG = window.GAGYEBU_CONFIG || {};
const sb = (CFG.supabaseUrl && window.supabase) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey,
  {auth:{persistSession:false, autoRefreshToken:true, storageKey:'toto-auth'}}) : null;
const chunk = (a, n) => Array.from({length:Math.ceil(a.length/n)}, (_,i) => a.slice(i*n, i*n+n));
function check(res){ if (res.error) throw new Error(res.error.message); return res.data; }
async function load(){
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const part = check(await sb.from('toto_bets').select('data').order('id').range(from, from + 999));
    rows.push(...part); if (part.length < 1000) break;
  }
  const st = check(await sb.from('toto_settings').select('data').eq('id', 1).maybeSingle());
  S.data = {bets: rows.map(r => r.data), settings: {...DEFAULTS, ...(st ? st.data : {})}};
  render();
}
async function save(list, del, msg){
  try {
    const now = new Date().toISOString();
    for (const c of chunk(list.map(b => ({id:b.id, data:{...b, updatedAt:now}, updated_at:now})), 500)) check(await sb.from('toto_bets').upsert(c));
    for (const c of chunk(del || [], 200)) check(await sb.from('toto_bets').delete().in('id', c));
    for (const b of list) { const i = S.data.bets.findIndex(x => x.id === b.id); if (i >= 0) S.data.bets[i] = b; else S.data.bets.push(b); }
    S.data.bets = S.data.bets.filter(b => !(del || []).includes(b.id));
    render(); if (msg) toast(msg);
  } catch(e){ toast('저장 실패: ' + (/row-level/.test(e.message) ? '이 이메일은 도토리 방앗간 권한이 없어요' : e.message)); }
}
async function saveSettings(msg){
  try { check(await sb.from('toto_settings').upsert({id:1, data:S.data.settings, updated_at:new Date().toISOString()})); render(); toast(msg || '저장했어요'); }
  catch(e){ toast('저장 실패: ' + e.message); }
}

// ---------- 계산 ----------
const payout = b => b.result === 'win' ? (+b.payout || 0) : b.result === 'refund' ? (+b.stake || 0) : 0;
const profit = b => b.result === 'wait' ? 0 : payout(b) - (+b.stake || 0);
const betsOf = month => S.data.bets.filter(b => b.date.slice(0,7) === month);
function stats(list){
  const done = list.filter(b => b.result !== 'wait');
  const stake = list.reduce((a,b) => a + (+b.stake||0), 0), stakeDone = done.reduce((a,b) => a + (+b.stake||0), 0);
  const pay = done.reduce((a,b) => a + payout(b), 0), wins = done.filter(b => b.result === 'win').length;
  const judged = done.filter(b => b.result !== 'refund').length;
  return {count:list.length, stake, pay, profit: pay - stakeDone, hit: judged ? wins / judged * 100 : 0, wins, judged,
          roi: stakeDone ? (pay - stakeDone) / stakeDone * 100 : 0, waiting: list.length - done.length};
}

// ---------- 화면 ----------
function header(){
  return `<header><div class="top"><h1>도토리 방앗간</h1>
    <span class="switch"><a href="index.html">가계부</a><a class="on">도토리 방앗간</a></span>
    <span class="sync"><a href="#" id="logout" style="color:inherit">로그아웃</a></span></div>
    <nav>${[['list','기록'],['games','경기'],['news','뉴스'],['stats','통계'],['set','설정']].map(([k,l]) => `<button data-v="${k}" class="${S.view===k?'on':''}">${l}</button>`).join('')}</nav></header>`;
}
function renderLogin(msg){
  $('#app').innerHTML = `<header><div class="top" style="padding-bottom:12px"><h1>도토리 방앗간</h1>
    <span class="switch"><a href="index.html">가계부</a><a class="on">도토리 방앗간</a></span></div></header>
    <div class="panel login"><h2>도토리 방앗간 로그인</h2>
    <p class="muted" style="margin-top:-6px">도토리 방앗간은 들어올 때마다 로그인이 필요해요.</p>
    <form id="lf" class="grid"><label class="f">이메일<input type="email" id="em" autocomplete="username" autofocus></label>
    <label class="f">비밀번호<input type="password" id="pw" autocomplete="current-password"></label>
    <button class="btn pri">들어가기</button><div class="muted" id="lerr">${esc(msg||'')}</div></form></div>`;
  $('#lf').onsubmit = async ev => { ev.preventDefault();
    const r = await sb.auth.signInWithPassword({email: $('#em').value.trim(), password: $('#pw').value});
    if (r.error) return $('#lerr').textContent = '이메일 또는 비밀번호가 맞지 않아요';
    // 토토 권한 확인 (허용 목록에 없으면 설정 조회가 거부되진 않지만 쓰기가 막히므로 미리 확인)
    const ok = await sb.rpc('is_toto');
    if (ok.error || !ok.data) { await sb.auth.signOut(); return $('#lerr').textContent = '이 이메일은 도토리 방앗간 권한이 없어요'; }
    try { await load(); } catch(e){ $('#lerr').textContent = e.message; } };
}
function render(){
  if (!S.data) return renderLogin();
  if (!S.month) S.month = today().slice(0,7);
  if (!S.year) S.year = +S.month.slice(0,4);
  $('#app').innerHTML = header() + '<main id="main"></main>';
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { S.view = b.dataset.v; S.edit = null; render(); });
  $('#logout').onclick = async ev => { ev.preventDefault(); await sb.auth.signOut(); S.data = null; renderLogin(); };
  ({list:viewList, games:viewGames, news:viewNews, stats:viewStats, set:viewSet})[S.view]();
}
function monthPicker(){
  return `<div class="row"><button class="btn sm" id="mp">‹</button><b style="min-width:96px;text-align:center">${monthLabel(S.month)}</b><button class="btn sm" id="mn">›</button></div>`;
}
function bindMonth(){ $('#mp').onclick = () => { S.month = shiftMonth(S.month,-1); render(); }; $('#mn').onclick = () => { S.month = shiftMonth(S.month,1); render(); }; }

// ===== 기록 =====
function betForm(b){
  const games = S.data.settings.games;
  return `<form id="bf" class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b>${b.id ? '기록 수정' : '새 기록'}</b></div>
    <div class="form">
      <label class="f">날짜<input type="date" name="date" value="${esc(b.date)}" required></label>
      <label class="f">게임<select name="game">${games.map(g => `<option ${g===b.game?'selected':''}>${esc(g)}</option>`).join('')}</select></label>
      <label class="f">회차<input name="round" value="${esc(b.round)}" placeholder="예: 85회차"></label>
      <label class="f" style="grid-column:span 2">경기·조합<input name="desc" value="${esc(b.desc)}" placeholder="예: 토트넘 승 + 레알 승"></label>
      <label class="f">구매금액<input name="stake" inputmode="numeric" value="${b.stake?won(b.stake):''}" required></label>
      <label class="f">배당률<input name="odds" inputmode="decimal" value="${b.odds||''}" placeholder="예: 3.25"></label>
      <label class="f">결과<select name="result">${Object.entries(RESULTS).map(([k,l]) => `<option value="${k}" ${k===b.result?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f">당첨금<input name="payout" inputmode="numeric" value="${b.payout?won(b.payout):''}" placeholder="적중이면 자동 계산"></label>
      <label class="f">리그<select name="league"><option value="">-</option>${Object.entries(LEAGUES).map(([k,l]) => `<option value="${k}" ${k===(b.league||b.match?.league)?'selected':''}>${l}</option>`).join('')}<option value="ETC" ${b.league==='ETC'?'selected':''}>기타</option></select></label>
      <label class="f">폴더 수<input name="folders" type="number" min="1" max="20" value="${b.folders||1}"></label>
      ${b.match ? `<label class="f">내 선택 (단폴 자동 판정)<select name="pick">${Object.entries(PICKS).filter(([k]) => k !== 'draw' || SPORT(b.match.league) === 'soccer').map(([k,l]) => `<option value="${k}" ${k===(b.pick||'')?'selected':''}>${l}</option>`).join('')}</select></label>` : ''}
      <label class="f">메모<input name="memo" value="${esc(b.memo)}"></label>
      ${b.match ? `<div class="muted" style="grid-column:1/-1">연결된 경기: ${esc(LEAGUES[b.match.league])} · ${esc(b.match.home)} vs ${esc(b.match.away)} (${b.match.date}) <button type="button" class="btn sm ghost" id="unlink">연결 해제</button></div>` : ''}
    </div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button type="button" class="btn ghost" id="bcancel">취소</button><button class="btn pri">${b.id?'수정 저장':'추가'}</button></div></form>`;
}
function bindBetForm(b){
  const f = $('#bf');
  const fmt = i => { const n = i.value.replace(/[^\d]/g,''); i.value = n ? (+n).toLocaleString('ko-KR') : ''; };
  const calc = () => { if (f.result.value === 'win' && f.odds.value && f.stake.value && !f.payout.dataset.touched) {
      const v = Math.floor(+f.stake.value.replace(/[^\d]/g,'') * +f.odds.value / 10) * 10; f.payout.value = v ? v.toLocaleString('ko-KR') : ''; } };
  f.stake.oninput = () => { fmt(f.stake); calc(); }; f.odds.oninput = calc; f.result.onchange = calc;
  f.payout.oninput = () => { f.payout.dataset.touched = 1; fmt(f.payout); };
  $('#bcancel').onclick = () => { S.edit = null; render(); };
  if ($('#unlink')) $('#unlink').onclick = () => { const {match, pick, ...rest} = {...b}; S.edit = rest; render(); };
  f.onsubmit = ev => { ev.preventDefault();
    const item = {...b, date:f.date.value, game:f.game.value, round:f.round.value.trim(), desc:f.desc.value.trim(),
      stake:+f.stake.value.replace(/[^\d]/g,''), odds:+f.odds.value || '', result:f.result.value,
      payout: f.result.value === 'win' ? +f.payout.value.replace(/[^\d]/g,'') : 0, memo:f.memo.value.trim(),
      league: f.league.value, folders: Math.max(1, +f.folders.value || 1)};
    if (f.pick) item.pick = f.pick.value;
    if (!item.stake) return toast('구매금액을 입력하세요');
    if (item.result === 'win' && !item.payout) return toast('당첨금을 입력하거나 배당률을 넣어주세요');
    const isNew = !item.id; if (isNew) item.id = uid();
    S.edit = isNew ? {date:item.date, game:item.game, round:item.round, result:'wait'} : null;
    S.month = item.date.slice(0,7);
    save([item], [], isNew ? '추가했어요' : '수정했어요');
  };
}
function resTag(b){ return `<span class="tag ${b.result==='refund'?'':b.result}">${RESULTS[b.result]}</span>`; }
function viewList(){
  const all = betsOf(S.month), st = stats(all), lim = +S.data.settings.monthlyLimit || 0;
  let list = all;
  if (S.f.res !== 'all') list = list.filter(b => b.result === S.f.res);
  if (S.f.game !== 'all') list = list.filter(b => b.game === S.f.game);
  list = [...list].sort((a,b) => b.date.localeCompare(a.date) || (b.updatedAt||'').localeCompare(a.updatedAt||''));
  const editing = S.edit === 'new' ? {date:today(), game:S.data.settings.games[0], result:'wait'} : S.edit;
  $('#main').innerHTML = `

// ===== 통계 =====
function viewStats(){
  const Y = S.year, months = Array.from({length:12}, (_,i) => ym(Y, i+1));
  const per = months.map(m => stats(betsOf(m)));
  const yearBets = S.data.bets.filter(b => b.date.startsWith(String(Y))), ys = stats(yearBets), all = stats(S.data.bets);
  let cum = 0; const cumArr = per.map(p => (cum += p.profit));
  const games = [...new Set(yearBets.map(b => b.game))].map(g => ({g, ...stats(yearBets.filter(b => b.game === g))})).sort((a,b) => b.stake - a.stake);
  // 월별 손익 막대 + 누적 선
  const W = 860, H = 220, P = {l:60, r:10, t:12, b:24}, step = (W-P.l-P.r)/12;
  const vals = per.map(p => p.profit).concat(cumArr), raw = Math.max(1000, ...vals.map(Math.abs)), pw = 10 ** Math.floor(Math.log10(raw)), mx = Math.ceil(raw / pw) * pw;
  const y = v => P.t + (H-P.t-P.b) * (1 - (v + mx) / (2*mx));
  const chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="월별 손익">
    ${[-mx, -mx/2, 0, mx/2, mx].map(t => `<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t===0?'stroke-width="1.5"':''}/><text x="${P.l-6}" y="${y(t)+4}" text-anchor="end">${Math.abs(t)>=10000?(+(t/10000).toFixed(1)).toLocaleString()+'만':Math.round(t).toLocaleString()}</text>`).join('')}
    ${per.map((p,i) => { const x = P.l + step*i + step*0.25, top = Math.min(y(0), y(p.profit)), h = Math.abs(y(p.profit) - y(0));
      return `<rect x="${x}" y="${top}" width="${step*0.5}" height="${h}" rx="2" fill="${p.profit>=0?'var(--win)':'var(--lose)'}"><title>${i+1}월 ${signed(p.profit)}원</title></rect><text x="${P.l+step*i+step/2}" y="${H-6}" text-anchor="middle">${i+1}월</text>`; }).join('')}
    <polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${cumArr.map((v,i) => `${P.l+step*i+step/2},${y(v)}`).join(' ')}"/>
  </svg>`;
  $('#main').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:14px"><div class="row"><button class="btn sm" id="yp">‹</button><b>${Y}년</b><button class="btn sm" id="yn">›</button></div></div>
    <div class="grid kpis">
      <div class="kpi"><div class="l">${Y}년 구매</div><div class="v">${won(ys.stake)}</div><div class="s">${ys.count}건</div></div>
      <div class="kpi"><div class="l">${Y}년 당첨</div><div class="v">${won(ys.pay)}</div><div class="s">적중률 ${ys.hit.toFixed(0)}%</div></div>
      <div class="kpi"><div class="l">${Y}년 손익</div><div class="v ${pm(ys.profit)}">${signed(ys.profit)}</div><div class="s">수익률 ${ys.roi.toFixed(1)}%</div></div>
      <div class="kpi"><div class="l">전체 누적 손익</div><div class="v ${pm(all.profit)}">${signed(all.profit)}</div><div class="s">총 구매 ${won(all.stake)}</div></div>
    </div>
    <div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">월별 손익</h2>
      <span class="muted"><span style="color:var(--win)">■</span> 이익 <span style="color:var(--lose)">■</span> 손실 <span style="color:var(--accent)">━</span> 누적</span></div>${chart}</div>
    <div class="panel"><h2>월별</h2><div class="tbl" style="border:0"><table>
      <tr><th>월</th><th class="num">건수</th><th class="num">구매</th><th class="num">당첨</th><th class="num">손익</th><th class="num">적중률</th><th class="num">누적 손익</th></tr>
      ${per.map((p,i) => p.count ? `<tr><td>${i+1}월</td><td class="num">${p.count}</td><td class="num">${won(p.stake)}</td><td class="num">${won(p.pay)}</td>
        <td class="num ${pm(p.profit)}">${signed(p.profit)}</td><td class="num">${p.judged?p.hit.toFixed(0)+'%':'-'}</td><td class="num ${pm(cumArr[i])}">${signed(cumArr[i])}</td></tr>` : '').join('') || '<tr><td colspan="7" class="empty">기록이 없어요</td></tr>'}
    </table></div></div>
    <div class="panel"><h2>게임별 <small>${Y}년</small></h2><div class="tbl" style="border:0"><table>
      <tr><th>게임</th><th class="num">건수</th><th class="num">구매</th><th class="num">손익</th><th class="num">적중률</th><th class="num">수익률</th></tr>
      ${games.map(g => `<tr><td>${esc(g.g)}</td><td class="num">${g.count}</td><td class="num">${won(g.stake)}</td><td class="num ${pm(g.profit)}">${signed(g.profit)}</td>
        <td class="num">${g.judged?g.hit.toFixed(0)+'%':'-'}</td><td class="num">${g.roi.toFixed(1)}%</td></tr>`).join('') || '<tr><td colspan="6" class="empty">기록이 없어요</td></tr>'}
    </table></div></div>`;
  $('#main').insertAdjacentHTML('beforeend', analysisPanel(yearBets, Y));
  $('#yp').onclick = () => { S.year--; render(); }; $('#yn').onclick = () => { S.year++; render(); };
}

function ko(name, league){
  if (!name) return '?';
  const list = league === 'MLB' ? KO_MLB : league === 'NBA' ? KO_NBA : league === 'KBO' ? KO_KBO : KO_SOCCER;

// NBA는 ESPN이 서버 요청을 막아서 브라우저에서 직접 불러와요 (실패하면 서버로)
const espnScore = v => v == null ? null : typeof v === 'object' ? (v.value ?? (v.displayValue != null ? +v.displayValue : null)) : (v === '' ? null : +v);
function espnGames(j, league){
  return (j.events || []).map(e => {
    const c = e.competitions?.[0] || {}, st = e.status?.type || c.status?.type || {};
    const side = h => (c.competitors || []).find(x => x.homeAway === h) || {}, H = side('home'), A = side('away');
    const status = /POSTPONED|CANCELED|CANCELLED|SUSPENDED/.test(st.name || '') ? 'postponed' : st.completed ? 'final' : st.state === 'in' ? 'live' : 'scheduled';
    return {id:String(e.id), league, start:e.date, home:{id:String(H.team?.id), name:H.team?.displayName || '?'}, away:{id:String(A.team?.id), name:A.team?.displayName || '?'},
      hs: status === 'scheduled' ? null : espnScore(H.score), as: status === 'scheduled' ? null : espnScore(A.score), status, statusText: st.description || ''};
  });
}
function espnStandings(j){
  const stat = (e, n) => (e.stats || []).find(x => x.name === n), CONF = {'Eastern Conference':'동부', 'Western Conference':'서부'};
  return {groups: (j.children || []).map(c => ({name: CONF[c.name] || c.name, rows: (c.standings?.entries || []).map(e => ({team:{id:String(e.team?.id), name:e.team?.displayName},
      w: stat(e,'wins')?.value ?? 0, l: stat(e,'losses')?.value ?? 0, pct: stat(e,'winPercent')?.displayValue ?? null, gb: stat(e,'gamesBehind')?.displayValue ?? null, seed: stat(e,'playoffSeed')?.value}))
    .sort((a,b) => (a.seed ?? 99) - (b.seed ?? 99) || b.w - a.w).map((r,i) => ({rank:i+1, team:r.team, p:r.w+r.l, w:r.w, d:null, l:r.l, pts:null, pct:r.pct, gb:r.gb}))}))};
}
async function espnDirect(body){
  const get = async path => { const r = await fetch('https://site.api.espn.com' + path); if (!r.ok) throw new Error('ESPN ' + r.status); return r.json(); };
  const ymd = d => d.replace(/-/g,'');
  if (body.kind === 'games') {
    const gs = [...espnGames(await get(`/apis/site/v2/sports/basketball/nba/scoreboard?dates=${ymd(addDays(body.date,-1))}`), 'NBA'),
                ...espnGames(await get(`/apis/site/v2/sports/basketball/nba/scoreboard?dates=${ymd(body.date)}`), 'NBA')];
    const seen = new Set();
    return gs.filter(g => kstDay(g.start) === body.date && !seen.has(g.id) && seen.add(g.id)).sort((a,b) => a.start.localeCompare(b.start));
  }
  if (body.kind === 'standings') return espnStandings(await get('/apis/v2/sports/basketball/nba/standings'));
  const reg = espnGames(await get(`/apis/site/v2/sports/basketball/nba/teams/${body.team}/schedule?seasontype=2`), 'NBA');
  return reg.some(g => g.status === 'final') ? reg
    : [...espnGames(await get(`/apis/site/v2/sports/basketball/nba/teams/${body.team}/schedule?seasontype=2&season=${today().slice(0,4)}`), 'NBA'), ...reg];
}
async function sports(body){
  const k = JSON.stringify(body);
  if (S.sc.has(k)) return S.sc.get(k);
  const p = (async () => {
    if (body.league === 'NBA') { try { return await espnDirect(body); } catch(e){ /* 서버로 재시도 */ } }
    const r = await sb.functions.invoke('sports', {body});
    if (r.error) { let m = r.error.message; try { const j = await r.error.context.json(); m = j.error || m; } catch(e){} throw new Error(m); }
    if (r.data?.error) throw new Error(r.data.error);
    return r.data.data;
  })();
  S.sc.set(k, p); p.catch(() => S.sc.delete(k));
  return p;
}

const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0,10); };

function teamForm(teamId, games, before){
  const done = games.filter(x => x.status === 'final' && x.start < before).sort((a,b) => a.start.localeCompare(b.start));
  const res = x => { const home = x.home.id === teamId, f = home ? x.hs : x.as, a = home ? x.as : x.hs; return {r: f > a ? 'W' : f < a ? 'L' : 'D', f, a, home, opp: home ? x.away : x.home}; };
  const all = done.map(res), rec = l => ({w: l.filter(x => x.r==='W').length, d: l.filter(x => x.r==='D').length, l: l.filter(x => x.r==='L').length});
  const avg = (l, k) => l.length ? (l.reduce((s,x) => s + (+x[k]||0), 0) / l.length).toFixed(1) : '-';
  return {last5: all.slice(-5), all, total: rec(all), home: rec(all.filter(x => x.home)), away: rec(all.filter(x => !x.home)), gf: avg(all,'f'), ga: avg(all,'a')};
}

async function autoJudge(){
  if (S.autoDone) return; S.autoDone = true;
  const pend = S.data.bets.filter(b => b.result === 'wait' && b.match && b.pick && (b.folders||1) === 1 && b.match.date <= today());
  if (!pend.length) return;
  const upd = [], needPay = [];
  for (const b of pend) {
    try {
      const gs = await sports({league:b.match.league, kind:'games', date:b.match.date});
      const g = gs.find(x => x.id === b.match.id);
      if (!g) continue;
      if (g.status === 'postponed') { upd.push({...b, result:'refund', payout:0, memo:(b.memo?b.memo+' · ':'')+'경기 연기·취소'}); continue; }
      if (g.status !== 'final') continue;
      const win = outcome(g) === b.pick;
      if (win && !b.odds) { needPay.push(b); continue; }
      upd.push({...b, result: win ? 'win' : 'lose', payout: win ? Math.floor(b.stake * b.odds / 10) * 10 : 0,
        memo: (b.memo ? b.memo + ' · ' : '') + `${g.hs}:${g.as}`});
    } catch(e){ /* 데이터 못 불러오면 다음에 */ }
  }
  if (upd.length) await save(upd, [], `경기 결과로 ${upd.length}건을 자동 반영했어요`);
  if (needPay.length) toast(`${needPay.length}건은 적중인데 배당률이 없어서 직접 당첨금을 넣어주세요`);
}

const BODY = {Knee:'무릎', Ankle:'발목', Hamstring:'햄스트링', Back:'허리', Shoulder:'어깨', Foot:'발', Hip:'엉덩이', Groin:'사타구니', Calf:'종아리', Wrist:'손목',
  Hand:'손', Elbow:'팔꿈치', Finger:'손가락', Thumb:'엄지', Achilles:'아킬레스건', Concussion:'뇌진탕', Illness:'질병', Oblique:'옆구리', Quadriceps:'대퇴사두',
  Toe:'발가락', Neck:'목', Rib:'갈비뼈', Abdomen:'복부', Forearm:'전완', Lat:'광배근', Leg:'다리', Shin:'정강이', Thigh:'허벅지', Head:'머리', Chest:'가슴', Personal:'개인 사유', 'Not Injury Related':'부상 외'};
async function espnGet(path){
  try { const r = await fetch('https://site.api.espn.com' + path); if (!r.ok) throw new Error('ESPN ' + r.status); return await r.json(); }
  catch(e){ return await sports({league:'ESPN', kind:'raw', path}); }   // 브라우저에서 막히면 서버로
}
function viewNews(){
  const N = S.n;
  const leagues = Object.keys(ESPN_PATH);
  if (!leagues.includes(N.league)) N.league = 'EPL';
  const hasInj = N.league === 'NBA' || N.league === 'MLB';
  if (!hasInj) N.mode = 'news';
  $('#main').innerHTML = `
    <div class="chips" style="margin-bottom:10px">${leagues.map(k => `<button class="chip" data-nl="${k}" style="cursor:pointer;padding:5px 12px;${N.league===k?'background:var(--ink);color:var(--bg);border-color:var(--ink)':''}">${LEAGUES[k]}</button>`).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="row">
        ${hasInj ? `<div class="seg"><button data-nm="news" class="${N.mode==='news'?'on':''}">뉴스</button><button data-nm="inj" class="${N.mode==='inj'?'on':''}">부상자 명단</button></div>` : ''}
        ${N.mode==='news' ? `<div class="seg">${[['all','전체'],['injury','부상'],['transfer','이적·계약'],['ban','징계']].map(([k,l]) => `<button data-nt="${k}" class="${N.tag===k?'on':''}">${l}</button>`).join('')}</div>` : ''}
      </div>
      <input id="nq" placeholder="팀·선수 검색 (예: 토트넘, Son)" value="${esc(N.q)}" style="min-width:200px">
    </div>
    <div id="nbox"><div class="empty">불러오는 중…</div></div>
    <p class="muted" style="margin-top:12px">출처: ESPN · 기사는 영어 원문이에요. 제목을 누르면 원문이 새 창으로 열려요.</p>`;
  document.querySelectorAll('[data-nl]').forEach(b => b.onclick = () => { N.league = b.dataset.nl; render(); });
  document.querySelectorAll('[data-nm]').forEach(b => b.onclick = () => { N.mode = b.dataset.nm; render(); });
  document.querySelectorAll('[data-nt]').forEach(b => b.onclick = () => { N.tag = b.dataset.nt; render(); });
  let qt; $('#nq').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { N.q = e.target.value.trim(); draw(); }, 250); };
  const box = $('#nbox'), path = ESPN_PATH[N.league];
  const key = N.league + N.mode;
  let data = null;
  const draw = () => { if (!data || $('#nbox') !== box) return; box.innerHTML = N.mode === 'inj' ? injHTML(data) : newsHTML(data); };
  const load = N.mode === 'inj' ? espnGet(`/apis/site/v2/sports/${path}/injuries`) : espnGet(`/apis/site/v2/sports/${path}/news?limit=40`);
  load.then(j => { data = j; if (S._nkey !== key) S._nkey = key; draw(); })
      .catch(e => { if ($('#nbox') === box) box.innerHTML = `<div class="panel empty">${esc(e.message)}</div>`; });
}
const matchQ = (q, ...texts) => { if (!q) return true; const t = texts.join(' ').toLowerCase(); return q.toLowerCase().split(/\s+/).every(w => t.includes(w)); };
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? `${Math.max(1,m)}분 전` : m < 1440 ? `${Math.round(m/60)}시간 전` : `${Math.round(m/1440)}일 전`;
}
function newsHTML(j){
  const N = S.n;
  const list = (j.articles || []).filter(a => a.headline).map(a => {
    const teams = (a.categories || []).filter(c => c.type === 'team').map(c => c.description || c.team?.description || '').filter(Boolean);
    return {...a, tags: tagsOf(a), teams, teamsKo: teams.map(t => ko(t, N.league))};
  }).filter(a => (N.tag === 'all' || a.tags.includes(N.tag)) && matchQ(N.q, a.headline, a.description, ...a.teams, ...a.teamsKo));
  if (!list.length) return '<div class="panel empty">조건에 맞는 뉴스가 없어요</div>';
  return list.map(a => `<div class="mcard" style="display:block;cursor:default">
    <div class="row" style="gap:12px;align-items:flex-start;flex-wrap:nowrap">
      ${a.images?.[0]?.url ? `<img src="${esc(a.images[0].url)}" alt="" loading="lazy" style="width:96px;height:64px;object-fit:cover;border-radius:8px;flex:none">` : ''}
      <div style="min-width:0">
        <a href="${esc(a.links?.web?.href || '#')}" target="_blank" rel="noopener" style="color:var(--ink);font-weight:600;text-decoration:none">${esc(a.headline)}</a>
        <div class="muted" style="margin-top:3px">${esc(a.description || '')}</div>
        <div class="msub">${a.tags.map(t => `<span class="tag ${t==='injury'?'lose':t==='transfer'?'win':'wait'}">${NEWS_TAGS[t][1]}</span>`).join('')}
          ${a.teamsKo.slice(0,3).map(t => `<span class="tag">${esc(t)}</span>`).join('')}<span>${a.published ? ago(a.published) : ''}</span></div>
      </div></div></div>`).join('');
}
function injHTML(j){
  const N = S.n;
  const teams = (j.injuries || []).map(t => ({name: t.displayName, ko: ko(t.displayName, N.league),
    rows: (t.injuries || []).filter(i => matchQ(N.q, t.displayName, ko(t.displayName, N.league), i.athlete?.displayName))})).filter(t => t.rows.length);
  if (!teams.length) return '<div class="panel empty">부상자 정보가 없어요</div>';
  const part = d => { if (!d) return ''; const b = BODY[d.type] || d.type || ''; const side = d.side === 'Left' ? '왼쪽 ' : d.side === 'Right' ? '오른쪽 ' : ''; return side + b + (d.detail ? ` (${d.detail})` : ''); };
  return teams.map(t => `<div class="panel"><h2>${esc(t.ko)} <small>${t.rows.length}명</small></h2>
    ${t.rows.map(i => `<div class="mrow" style="padding:7px 0;border-bottom:1px solid var(--line);align-items:center">
      <span style="min-width:0"><b>${esc(i.athlete?.displayName || '')}</b> <span class="muted">${esc(i.athlete?.position?.abbreviation || '')}</span>
        <div class="muted">${esc(part(i.details))}${i.shortComment ? ` · <span title="${esc(i.longComment || '')}">${esc(i.shortComment.length > 90 ? i.shortComment.slice(0, 90) + '…' : i.shortComment)}</span>` : ''}</div></span>
      <span style="text-align:right;white-space:nowrap"><span class="tag ${/Out|IL/.test(i.status)?'lose':'wait'}">${esc(INJ_STATUS[i.status] || i.status || '')}</span>
        ${i.details?.returnDate ? `<div class="muted">복귀 예상 ${i.details.returnDate.slice(5).replace('-','/')}</div>` : ''}</span></div>`).join('')}
  </div>`).join('');
}

// ===== 내 기록 분석 =====
function analysisPanel(list, Y){
  const done = list.filter(b => b.result !== 'wait');
  if (!done.length) return '';
  const bucket = (title, keyFn, order) => {
    const m = new Map(); done.forEach(b => { const k = keyFn(b); if (!m.has(k)) m.set(k, []); m.get(k).push(b); });
    const rows = [...m.entries()].map(([k, l]) => ({k, ...stats(l)})).sort((a,b) => order ? order.indexOf(a.k) - order.indexOf(b.k) : b.stake - a.stake);
    return `<div class="panel"><h2>${title} <small>${Y}년 · 결과 나온 기록만</small></h2><div class="tbl" style="border:0"><table>
      <tr><th>구분</th><th class="num">건수</th><th class="num">구매</th><th class="num">손익</th><th class="num">적중률</th><th class="num">수익률</th></tr>
      ${rows.map(r => `<tr><td>${esc(r.k)}</td><td class="num">${r.count}</td><td class="num">${won(r.stake)}</td><td class="num ${pm(r.profit)}">${signed(r.profit)}</td>
        <td class="num">${r.judged?r.hit.toFixed(0)+'%':'-'}</td><td class="num ${pm(r.roi)}">${r.roi.toFixed(1)}%</td></tr>`).join('')}
    </table></div></div>`;
  };
  const oddsB = ['배당 없음','1.5 미만','1.5~2','2~3','3~5','5~10','10 이상'];
  const ob = b => !b.odds ? oddsB[0] : b.odds < 1.5 ? oddsB[1] : b.odds < 2 ? oddsB[2] : b.odds < 3 ? oddsB[3] : b.odds < 5 ? oddsB[4] : b.odds < 10 ? oddsB[5] : oddsB[6];
  const fb = b => { const n = b.folders || 1; return n >= 5 ? '5폴더 이상' : n + '폴더'; };
  return `<h2 style="font-size:16px;margin:24px 0 10px">내 기록 분석</h2>`
    + bucket('리그별', b => LEAGUES[b.league || b.match?.league] || (b.league==='ETC'?'기타':'리그 미지정'))
    + bucket('배당 구간별', ob, oddsB)
    + bucket('폴더 수별', fb, ['1폴더','2폴더','3폴더','4폴더','5폴더 이상']);
}

if (!sb) $('#app').innerHTML = '<div class="panel login">config.js 설정이 필요해요</div>'; else renderLogin();
</script>
