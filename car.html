<!doctype html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" href="./favicon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다람이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#23211c; --muted2:#7a7466; --line:#e4dfd3;
  --accent:#2f6f5e; --accent-soft:#e3efe9; --danger:#b4513a; --warn:#c4862b;
  --h:#dfe6f5; --w:#fbefcf; --s:#ece9e1; --nut:#c27a3e; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1916; --panel:#22211d; --ink:#ece8de; --muted2:#a39d8f; --line:#38352e;
    --accent:#6fb59e; --accent-soft:#24362f; --danger:#e0876f; --h:#2a3247; --w:#3e3624; --s:#2d2b26; --nut:#e0a46a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1100px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.02em}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:13px}
.switch a{padding:4px 12px;text-decoration:none;color:var(--muted2);cursor:pointer}
.switch a.on{background:var(--ink);color:var(--bg);cursor:default}
.switch .more{display:none}
@media(max-width:600px){ .switch a:not(.on):not(.more){display:none} .switch.open a{display:inline-block !important} .switch .more{display:inline-block} .switch.open{flex-wrap:wrap;border-radius:14px} }
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e5484d;margin-left:4px;vertical-align:2px}
.top .sync{font-size:12px;color:var(--muted2);margin-left:auto}
nav{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav button.on{color:var(--ink);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 12px;font-weight:600}
.panel h2 small{font-weight:400;color:var(--muted2);margin-left:6px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted2)}
label.f > input,label.f > select,label.f > textarea{font-size:15px;color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
.form .wide{grid-column:1/-1}
.muted{color:var(--muted2);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted2)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--s);white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)} .tag.warn{background:#f6e3c4;color:#7a4f0e} .tag.bad{background:#f7d9d2;color:#8a2c1c}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--s);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--danger)}
.login{max-width:340px;margin:16vh auto;padding:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#fff4dc,#ffe3d1);border-radius:16px;padding:18px 20px;margin-bottom:16px;color:#23211c}
.hero .nm{font-size:24px;font-weight:700;letter-spacing:-.02em}
.hero .odo{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.hero .say{background:#fff;border-radius:14px;padding:6px 12px;font-size:13.5px;position:relative;display:inline-block;margin-top:6px}
.park{margin-left:auto;background:#fffc;border-radius:12px;padding:10px 14px;min-width:180px}
.park .l{font-size:12px;color:#7a7466}
.park .v{font-size:20px;font-weight:700}
@media(max-width:600px){ .park{margin-left:0;width:100%} }
.todo{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.todo:first-of-type{border-top:0}
.todo .ic{font-size:20px;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted2)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted2);font-weight:600}
td.r,th.r{text-align:right}
td.wrap{white-space:normal}
.tbl{overflow-x:auto}
.part{display:grid;grid-template-columns:1fr 200px auto;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.part:first-of-type{border-top:0}
@media(max-width:640px){ .part{grid-template-columns:1fr auto} .part .bw{grid-column:1/-1;order:3} }
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.info div{background:var(--bg);border-radius:10px;padding:10px 12px}
.info .l{font-size:12px;color:var(--muted2)}
.info .v{font-weight:600;font-size:16px}
svg text{fill:var(--muted2);font-size:11px}
.note{background:var(--s);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--muted2)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (Math.round(n)||0).toLocaleString('ko-KR');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const toNum = v => +String(v || '').replace(/[^\d]/g, '') || 0;
const toDec = v => { const n = parseFloat(String(v || '').replace(/,/g,'')); return isNaN(n) ? 0 : n; };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
const pad = n => String(n).padStart(2,'0');
const fmtD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmtD(new Date());
const parseD = s => new Date(s + 'T00:00:00');
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); };
const addMonths = (s, n) => { const d = parseD(s); d.setMonth(d.getMonth() + n); return fmtD(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const WD = ['일','월','화','수','목','금','토'];
const ymd = s => s ? `${s.slice(2,4)}.${+s.slice(5,7)}.${+s.slice(8)}` : '';
const md = s => s ? `${+s.slice(5,7)}/${+s.slice(8)}(${WD[parseD(s).getDay()]})` : '';
const dd = s => { const n = diffDays(today(), s); return n > 0 ? `D-${n}` : n === 0 ? '오늘' : `${-n}일 지남`; };

// 투싼 2018 디젤 기준 예시 주기 — 차량 취급설명서·정비소 안내가 우선이에요. 화면에서 바로 고칠 수 있어요.
const DEFAULT_PARTS = [
  {key:'oil', name:'엔진오일·오일필터', km:10000, months:12, on:true},
  {key:'aircon', name:'에어컨(실내) 필터', km:15000, months:12, on:true},
  {key:'aircl', name:'에어클리너(엔진) 필터', km:40000, months:24, on:true},
  {key:'fuelf', name:'연료필터 (디젤)', km:30000, months:24, on:true},
  {key:'rot', name:'타이어 위치 교환', km:10000, months:12, on:true},
  {key:'tire', name:'타이어 교체', km:50000, months:60, on:true},
  {key:'wiper', name:'와이퍼', km:0, months:12, on:true},
  {key:'brake', name:'브레이크 패드', km:40000, months:0, on:true},
  {key:'bfluid', name:'브레이크액', km:40000, months:24, on:true},
  {key:'battery', name:'배터리', km:0, months:48, on:true},
  {key:'coolant', name:'냉각수 (최초)', km:200000, months:120, on:true},
  {key:'atf', name:'자동변속기 오일 (가혹 조건)', km:100000, months:0, on:false},
  {key:'urea', name:'요소수 보충', km:10000, months:0, on:false},
];
const FUEL_KW = ['주유','오일뱅크','칼텍스','S-OIL','에쓰오일','SK에너지','에너지','알뜰','셀프'];
const COST_RULES = [['연료', null], ['정비', /정비|카센터|오토|타이어|모터스|공업사|블루핸즈|스피드메이트|오일교환|워셔|부품/], ['보험·세금', /보험|자동차세|세금|과태료|검사|교통안전/], ['주차·통행료', /주차|하이패스|통행|도로공사|톨|파킹/], ['세차', /세차|워시/]];

const S = { recs:null, view:'home', edit:null, year:new Date().getFullYear(), ledger:null, toto:false };
const CFG = window.GAGYEBU_CONFIG || {};
const sb = (CFG.supabaseUrl && window.supabase) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
function cfg(){
  let c = S.recs.find(r => r.kind === 'cfg');
  if (!c) { c = {id:'cfg', kind:'cfg'}; S.recs.push(c); }
  c.info = c.info || {name:'다람이', model:'투싼 (2018) 디젤', plate:'', bought:'', tire:'', oil:'', wiper:'', memo:''};
  c.parts = c.parts || JSON.parse(JSON.stringify(DEFAULT_PARTS));
  c.partLast = c.partLast || {};   // 기록 없이 "마지막 교체" 만 아는 경우 {key:{date,km}}
  c.ins = c.ins || {}; c.insp = c.insp || {}; c.tax = c.tax || {}; c.loan = c.loan || {};
  c.parking = c.parking || {text:'', at:''};
  c.fuelKw = c.fuelKw || FUEL_KW.slice(); c.ledgerCats = c.ledgerCats || null;
  return c;
}
const fuels = () => S.recs.filter(r => r.kind === 'fuel').sort((a,b) => a.date.localeCompare(b.date) || (+a.km||0) - (+b.km||0));
const maints = () => S.recs.filter(r => r.kind === 'maint').sort((a,b) => b.date.localeCompare(a.date));
const odos = () => S.recs.filter(r => r.kind === 'odo');
function odoPoints(){ return [...fuels(), ...maints(), ...odos()].filter(r => +r.km).map(r => ({d:r.date, km:+r.km})).sort((a,b) => a.d.localeCompare(b.d) || a.km - b.km); }
const curKm = () => Math.max(0, ...odoPoints().map(p => p.km));
function perDay(){   // 최근 1년 하루 평균 주행거리
  const pts = odoPoints(); if (pts.length < 2) return 35;
  const from = addDays(today(), -365); const r = pts.filter(p => p.d >= from); const a = (r.length >= 2 ? r : pts)[0], b = pts[pts.length - 1];
  const days = diffDays(a.d, b.d); return days > 14 && b.km > a.km ? (b.km - a.km) / days : 35;
}

// ---------- 저장소 ----------
function check(res){ if (res.error) { if (/JWT|auth/i.test(res.error.message)) { S.recs = null; renderLogin(); throw new Error('login'); } throw new Error(res.error.message); } return res.data; }
async function fetchRecs(){
  const rows = []; for (let off = 0; ; off += 1000) {
    const res = await sb.from('car').select('id,data').order('id').range(off, off + 999);
    if (res.error && /car/.test(res.error.message) && !/JWT/.test(res.error.message)) {
      $('#app').innerHTML = `<div class="panel login"><h2>한 번만 설정이 필요해요</h2><p class="muted">Supabase <b>SQL Editor</b>에서 <code>car_schema.sql</code> 내용을 붙여넣고 Run 해주세요. 그다음 새로고침하면 돼요.</p></div>`;
      throw new Error('setup'); }
    const part = check(res); rows.push(...part.map(r => r.data)); if (part.length < 1000) break; }
  return rows;
}
async function load(){
  const { data:{ session } } = await sb.auth.getSession();
  S.toto = (session?.user?.email || '').toLowerCase() === 'tksid1@gmail.com';
  const st = check(await sb.from('settings').select('data').eq('id', 1).maybeSingle());
  S.members = st && st.data && st.data.members || [{id:'h',name:'남편'},{id:'w',name:'아내'}];
  S.expCats = ((st && st.data && st.data.categories || {}).expense || []).map(c => c.name);
  S.recs = await fetchRecs(); S.syncedAt = new Date(); render(); syncStatus();
}
async function save(rec, msg){
  try { rec.updatedAt = new Date().toISOString();
    check(await sb.from('car').upsert({id:rec.id, data:rec, updated_at:rec.updatedAt}));
    S.selfWrite = Date.now(); S.syncedAt = new Date();
    const i = S.recs.findIndex(x => x.id === rec.id); if (i >= 0) S.recs[i] = rec; else S.recs.push(rec);
    render(); if (msg) toast(msg); syncStatus(); return true;
  } catch(e){ if (e.message !== 'login') toast('저장 실패: ' + e.message); return false; }
}
async function remove(id, msg){
  try { check(await sb.from('car').delete().eq('id', id)); S.selfWrite = Date.now(); S.recs = S.recs.filter(r => r.id !== id); render(); toast(msg || '삭제했어요'); syncStatus(); }
  catch(e){ if (e.message !== 'login') toast('삭제 실패: ' + e.message); }
}
// 다른 페이지(가계부 등)의 「다람이」 버튼 빨간 점용 — 곧 챙길 것 개수만 따로 저장
async function syncStatus(){
  const n = todos().filter(t => t.days <= 30).length;
  const old = S.recs.find(r => r.id === 'status');
  if (old && old.count === n && old.day === today()) return;
  const rec = {id:'status', kind:'status', count:n, day:today()};
  try { await sb.from('car').upsert({id:'status', data:rec, updated_at:new Date().toISOString()}); S.selfWrite = Date.now();
    const i = S.recs.findIndex(x => x.id === 'status'); if (i >= 0) S.recs[i] = rec; else S.recs.push(rec); } catch(e){}
}
function subscribe(){
  if (S.channel) return;
  S.channel = sb.channel('car').on('postgres_changes', {event:'*', schema:'public', table:'car'}, () => {
    if (S.selfWrite && Date.now() - S.selfWrite < 3000) return; clearTimeout(S._rt); S._rt = setTimeout(pull, 800); }).subscribe();
}
async function pull(){
  if (S.edit || document.activeElement?.matches('input,textarea,select')) { S.pending = true; return; }
  try { S.recs = await fetchRecs(); S.pending = false; S.syncedAt = new Date(); render(); } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.recs && S.pending) pull(); });

// ---------- 계산 ----------
function partState(p){
  const c = cfg(); const km = curKm(), pd = perDay();
  const rec = maints().find(m => (m.items || []).includes(p.key));
  const last = rec ? {date:rec.date, km:+rec.km || 0} : c.partLast[p.key] && c.partLast[p.key].date ? {date:c.partLast[p.key].date, km:+c.partLast[p.key].km || 0} : null;
  if (!last) return {last:null};
  let dueByKm = null, dueByDate = null, remKm = null, ratio = 0;
  if (+p.km && last.km) { remKm = last.km + +p.km - km; dueByKm = addDays(today(), Math.round(remKm / pd)); ratio = Math.max(ratio, (km - last.km) / p.km); }
  if (+p.months) { dueByDate = addMonths(last.date, +p.months); ratio = Math.max(ratio, diffDays(last.date, today()) / (p.months * 30.44)); }
  const due = [dueByKm, dueByDate].filter(Boolean).sort()[0] || null;
  return {last, remKm, dueByDate, due, ratio, days: due ? diffDays(today(), due) : null};
}
function taxPeriods(y){ return [{key:`${y}-yr`, name:`${y}년 연납 (할인)`, from:`${y}-01-16`, to:`${y}-01-31`}, {key:`${y}-1`, name:`${y}년 1기분`, from:`${y}-06-16`, to:`${y}-06-30`}, {key:`${y}-2`, name:`${y}년 2기분`, from:`${y}-12-16`, to:`${y}-12-31`}]; }
function nextTax(){
  const c = cfg(), t = today(), y = +t.slice(0,4);
  for (const yy of [y, y+1]) { const yrPaid = c.tax[`${yy}-yr`];
    for (const p of taxPeriods(yy)) { if (p.to < t || c.tax[p.key]) continue; if (yrPaid && p.key !== `${yy}-yr`) continue;
      if (p.key.endsWith('-yr') && p.to < t) continue; return p; } }
  return null;
}
function todos(){
  const c = cfg(), list = [];
  c.parts.filter(p => p.on).forEach(p => { const s = partState(p); if (s.due) list.push({ic:'🔧', what:p.name, due:s.due, days:s.days, sub: s.remKm != null ? (s.remKm >= 0 ? `${won(s.remKm)}km 남음` : `${won(-s.remKm)}km 지남`) : '', go:'maint'}); });
  if (c.ins.end) list.push({ic:'🛡️', what:`보험 만기${c.ins.company ? ' · ' + c.ins.company : ''}`, due:c.ins.end, days:diffDays(today(), c.ins.end), sub:'갱신 견적 비교하기', go:'docs'});
  if (c.insp.expire) { const from = addDays(c.insp.expire, -31); list.push({ic:'🔍', what:'정기(종합)검사', due:from, days:diffDays(today(), from), sub:`검사 기간 ${md(from)} ~ ${md(addDays(c.insp.expire, 31))}`, go:'docs'}); }
  const tx = nextTax(); if (tx) list.push({ic:'🧾', what:`자동차세 ${tx.name}`, due:tx.from, days:diffDays(today(), tx.from), sub:`${md(tx.from)} ~ ${md(tx.to)}`, go:'docs'});
  return list.sort((a,b) => a.due.localeCompare(b.due));
}
function efficiency(){   // 가득 주유 사이 구간으로 연비 계산
  const f = fuels().filter(x => +x.km && +x.liters); const out = [];
  let prevFull = null, lit = 0;
  for (const x of f) { if (prevFull) lit += +x.liters;
    if (x.full) { if (prevFull && x.km > prevFull.km && lit > 0) out.push({date:x.date, kmpl: Math.round((x.km - prevFull.km) / lit * 10) / 10, id:x.id}); prevFull = x; lit = 0; } }
  return out;
}

function barChart(rows){
  const W = 680, H = 180, P = {l:10, r:10, t:22, b:24}, max = Math.max(...rows.map(r => r[1]), 1), bw = (W - P.l - P.r) / rows.length;

    return `<rect x="${x + bw*.18}" y="${H - P.b - h}" width="${bw*.64}" height="${h}" rx="4" fill="var(--nut)"/><text x="${x + bw/2}" y="${H-6}" text-anchor="middle">${l}</text>
      <text x="${x + bw/2}" y="${H - P.b - h - 6}" text-anchor="middle" style="font-size:10.5px">${v >= 10000 ? Math.round(v/1000) / 10 + '만' : won(v)}</text>`; }).join('')}</svg>`;
}

    <div class="panel"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">소모품 교체 시기 <small>현재 ${won(curKm())}km · 하루 ${Math.round(perDay())}km 기준 예상</small></h2>

      ${pe ? `<div class="tbl"><table><tr><th>사용</th><th>항목</th><th class="r">km마다</th><th class="r">개월마다</th><th>마지막 교체 (기록 없을 때)</th></tr>
        ${c.parts.map((p,i) => `<tr><td><input type="checkbox" data-pon="${i}" ${p.on?'checked':''}></td><td><input data-pnm="${i}" value="${esc(p.name)}" style="width:190px"></td>
          <td class="r"><input data-pkm="${i}" inputmode="numeric" value="${p.km||''}" style="width:90px;text-align:right"></td><td class="r"><input data-pmo="${i}" inputmode="numeric" value="${p.months||''}" style="width:70px;text-align:right"></td>
          <td><input type="date" data-pld="${i}" value="${esc((c.partLast[p.key]||{}).date||'')}"> <input data-plk="${i}" inputmode="numeric" placeholder="km" value="${esc((c.partLast[p.key]||{}).km||'')}" style="width:90px"></td></tr>`).join('')}</table></div>
        <div class="row" style="margin-top:10px;justify-content:space-between"><button class="btn sm" id="padd">+ 항목 추가</button><span class="row"><button class="btn sm ghost" id="preset">투싼 디젤 기본값으로</button><button class="btn pri" id="psave">저장</button></span></div>
        <p class="muted">기본값은 2018 투싼 디젤 기준 예시예요. 차량 취급설명서의 점검 주기표나 정비소 안내가 우선이에요. 짧은 거리 위주·잦은 공회전 같은 가혹 조건이면 주기를 줄여주세요.</p>`
      : c.parts.filter(p => p.on).map(p => { const s = partState(p); const pct = Math.min(100, Math.round((s.ratio||0) * 100));
        return `<div class="part"><div><div style="font-weight:600">${esc(p.name)}</div><div class="muted">${[p.km ? won(p.km) + 'km' : '', p.months ? p.months + '개월' : ''].filter(Boolean).join(' / ')}마다
          ${s.last ? ` · 마지막 ${ymd(s.last.date)}${s.last.km ? ' ' + won(s.last.km) + 'km' : ''}` : ''}</div></div>
          <div class="bw">${s.last ? `<div class="bar ${pct >= 100 ? 'bad' : pct >= 85 ? 'warn' : ''}"><i style="width:${pct}%"></i></div><div class="muted" style="margin-top:3px">${s.remKm != null ? (s.remKm >= 0 ? won(s.remKm) + 'km 남음' : won(-s.remKm) + 'km 지남') + ' · ' : ''}${s.due ? '예상 ' + md(s.due) : ''}</div>` : '<span class="muted">기록 없음</span>'}</div>
          <div>${s.last ? `<span class="tag ${s.days < 0 ? 'bad' : s.days <= 30 ? 'warn' : 'ok'}">${dd(s.due)}</span>` : `<button class="btn sm" data-first="${p.key}">교체 기록</button>`}</div></div>`; }).join('')}</div>
    <div class="panel"><h2>정비 이력</h2>${ms.length ? ms.map(m => `<div class="todo" style="grid-template-columns:30px 1fr auto"><div class="ic">🔧</div>
        <div><div style="font-weight:600">${(m.items||[]).map(k => esc((c.parts.find(p => p.key === k) || {name:k}).name)).join(', ') || '정비'}</div>
        <div class="muted">${ymd(m.date)}${m.km ? ' · ' + won(m.km) + 'km' : ''}${m.shop ? ' · ' + esc(m.shop) : ''}</div>${m.memo ? `<div class="muted" style="white-space:pre-wrap">${esc(m.memo)}</div>` : ''}</div>
        <span class="row" style="gap:6px">${+m.cost ? `<b class="num">${won(m.cost)}원</b>` : ''}<button class="btn sm ghost" data-me="${m.id}">수정</button></span></div>`).join('')
      : '<div class="empty">정비소에 다녀오면 한 일과 주행거리를 적어두세요. 소모품 교체 시기가 자동으로 계산돼요.</div>'}</div>`;
  $('#madd').onclick = () => { newMaint(); window.scrollTo(0,0); };
  $('#pedit').onclick = () => { S.edit = pe ? null : {_parts:true}; render(); };
  $$('[data-first]').forEach(b => b.onclick = () => { newMaint({items:[b.dataset.first]}); window.scrollTo(0,0); });
  $$('[data-me]').forEach(b => b.onclick = () => { S.edit = {_maint:true, ...JSON.parse(JSON.stringify(S.recs.find(r => r.id === b.dataset.me)))}; render(); window.scrollTo(0,0); });
  if (pe) {
    const read = () => { c.parts.forEach((p,i) => { p.on = $(`[data-pon="${i}"]`).checked; p.name = $(`[data-pnm="${i}"]`).value.trim() || p.name; p.km = toNum($(`[data-pkm="${i}"]`).value); p.months = toNum($(`[data-pmo="${i}"]`).value);
      const d = $(`[data-pld="${i}"]`).value, k = toNum($(`[data-plk="${i}"]`).value); if (d) c.partLast[p.key] = {date:d, km:k}; else delete c.partLast[p.key]; }); };
    $('#padd').onclick = () => { read(); c.parts.push({key:uid(), name:'새 항목', km:0, months:12, on:true}); render(); };
    $('#preset').onclick = () => { if (confirm('교체 주기를 기본값으로 되돌릴까요? (정비 기록은 그대로예요)')) { c.parts = JSON.parse(JSON.stringify(DEFAULT_PARTS)); S.edit = null; save(c, '기본값으로 되돌렸어요'); } };
    $('#psave').onclick = () => { read(); S.edit = null; save(c, '교체 주기를 저장했어요'); };
  }
  if (e) { const f = $('#mf');
    f.km.oninput = () => { const n = toNum(f.km.value); f.km.value = n ? won(n) : ''; };
    f.cost.oninput = () => { const n = toNum(f.cost.value); f.cost.value = n ? won(n) : ''; };
    $$('[data-it]').forEach(b => b.onclick = () => { const k = b.dataset.it; e.items = e.items.includes(k) ? e.items.filter(x => x !== k) : [...e.items, k]; b.classList.toggle('on'); });
    $('#mcancel').onclick = () => { S.edit = null; render(); };
    if ($('#mdel')) $('#mdel').onclick = () => { if (confirm('이 정비 기록을 삭제할까요?')) { S.edit = null; remove(e.id); } };
    f.onsubmit = ev => { ev.preventDefault();
      const rec = {id:e.id || uid(), kind:'maint', date:f.date.value, km:toNum(f.km.value), shop:f.shop.value.trim(), items:e.items, memo:f.memo.value.trim(), cost:toNum(f.cost.value)};
      S.edit = null; save(rec, '정비 기록을 저장했어요'); }; }
}

// ----- 서류·일정 -----
function viewDocs(){
  const c = cfg(), ed = S.edit && S.edit._docs;
  const i = c.info, ins = c.ins, insp = c.insp, loan = c.loan;
  const y = new Date().getFullYear();
  const loanLeft = loan.end ? Math.max(0, Math.ceil(diffDays(today(), loan.end) / 30.44)) : null;
  $('#main').innerHTML = `<div class="panel"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">차량 정보 <small>정비소·마트에서 바로 꺼내 보는 용</small></h2><button class="btn sm" id="dedit">${ed ? '닫기' : '수정'}</button></div>
      ${ed ? `<div class="form">
        <label class="f">이름<input id="i_name" value="${esc(i.name)}"></label><label class="f">차종<input id="i_model" value="${esc(i.model)}"></label>
        <label class="f">차량번호<input id="i_plate" value="${esc(i.plate)}" placeholder="12가 3456"></label><label class="f">출고·구입일<input id="i_bought" type="date" value="${esc(i.bought)}"></label>
        <label class="f">타이어 규격<input id="i_tire" value="${esc(i.tire)}" placeholder="타이어 옆면 숫자 (예: 225/60R17)"></label><label class="f">엔진오일 규격<input id="i_oil" value="${esc(i.oil)}" placeholder="취급설명서 확인 (예: 5W-30 C3)"></label>
        <label class="f">와이퍼 길이<input id="i_wiper" value="${esc(i.wiper)}" placeholder="운전석 / 조수석 mm"></label><label class="f wide">메모<input id="i_memo" value="${esc(i.memo)}" placeholder="예: 블랙박스 SD카드 64GB, 보조키는 신발장"></label>
        <div class="wide"><h2 style="margin:10px 0 6px">보험</h2></div>
        <label class="f">보험사<input id="s_company" value="${esc(ins.company)}"></label><label class="f">만기일<input id="s_end" type="date" value="${esc(ins.end)}"></label>
        <label class="f">보험료 (원)<input id="s_premium" inputmode="numeric" value="${ins.premium ? won(ins.premium) : ''}"></label><label class="f">긴급출동 번호<input id="s_phone" value="${esc(ins.phone)}" placeholder="보험증권에 있는 번호"></label>
        <label class="f wide">특약·메모<input id="s_memo" value="${esc(ins.memo)}" placeholder="예: 마일리지 특약 — 만기 때 주행거리 사진 제출"></label>
        <div class="wide"><h2 style="margin:10px 0 6px">정기검사</h2></div>
        <label class="f">검사 유효기간 만료일<input id="p_expire" type="date" value="${esc(insp.expire)}"></label><label class="f wide">메모<input id="p_memo" value="${esc(insp.memo)}" placeholder="자동차등록증 '검사유효기간' 칸 · 안내 문자 날짜"></label>
        <div class="wide"><h2 style="margin:10px 0 6px">할부 (있으면)</h2></div>
        <label class="f">월 납입액 (원)<input id="l_monthly" inputmode="numeric" value="${loan.monthly ? won(loan.monthly) : ''}"></label><label class="f">마지막 납입일<input id="l_end" type="date" value="${esc(loan.end)}"></label>
      </div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn pri" id="dsave">저장</button></div>`
      : `<div class="info">${[['차량번호', i.plate], ['차종', i.model], ['출고·구입', i.bought ? ymd(i.bought) : ''], ['타이어', i.tire], ['엔진오일', i.oil], ['와이퍼', i.wiper]].map(([l,v]) => `<div><div class="l">${l}</div><div class="v">${esc(v || '-')}</div></div>`).join('')}</div>${i.memo ? `<p class="muted">${esc(i.memo)}</p>` : ''}`}</div>
    ${ed ? '' : `<div class="grid2">
      <div class="panel"><h2>🛡️ 보험</h2>${ins.end ? `<div class="row between"><b>${esc(ins.company || '보험')}</b><span class="tag ${diffDays(today(), ins.end) <= 30 ? 'warn' : ''}">만기 ${md(ins.end)} · ${dd(ins.end)}</span></div>
        <div class="muted" style="margin-top:6px">${ins.premium ? '보험료 ' + won(ins.premium) + '원' : ''}${ins.phone ? ` · 긴급출동 <a href="tel:${esc(ins.phone)}">${esc(ins.phone)}</a>` : ''}</div>${ins.memo ? `<div class="muted">${esc(ins.memo)}</div>` : ''}
        ${diffDays(today(), ins.end) <= 45 ? '<div class="note" style="margin-top:8px">만기 한 달 전쯤 다이렉트 보험 견적을 비교해 보세요.</div>' : ''}` : '<div class="muted">위 「수정」에서 보험 만기일을 넣어주세요</div>'}</div>
      <div class="panel"><h2>🔍 정기검사</h2>${insp.expire ? `<div class="row between"><b>유효기간 ${ymd(insp.expire)}</b><span class="tag ${diffDays(today(), addDays(insp.expire,-31)) <= 30 ? 'warn' : ''}">${dd(addDays(insp.expire,-31))}</span></div>
        <div class="muted" style="margin-top:6px">검사 받을 수 있는 기간: ${md(addDays(insp.expire,-31))} ~ ${md(addDays(insp.expire,31))} (만료일 앞뒤 31일)</div>${insp.memo ? `<div class="muted">${esc(insp.memo)}</div>` : ''}`
        : '<div class="muted">자동차등록증의 검사 유효기간 만료일을 넣어주세요</div>'}</div></div>
    <div class="panel"><h2>🧾 자동차세 <small>1월에 한 번에 내면(연납) 할인돼요</small></h2>
      ${[y, y+1].map(yy => taxPeriods(yy).map(p => { const paid = c.tax[p.key], yrPaid = c.tax[`${yy}-yr`] && !p.key.endsWith('-yr');
        return `<div class="todo" style="grid-template-columns:24px 1fr auto"><input type="checkbox" data-tax="${p.key}" ${paid?'checked':''} ${yrPaid?'disabled':''} style="width:18px;height:18px;accent-color:var(--accent)">
          <div><div style="font-weight:600;${paid||yrPaid?'text-decoration:line-through;color:var(--muted2)':''}">${p.name}</div><div class="muted">${md(p.from)} ~ ${md(p.to)}${yrPaid ? ' · 연납으로 냈어요' : ''}</div></div>
          <span class="tag ${paid||yrPaid ? 'ok' : p.to < today() ? 'bad' : diffDays(today(), p.from) <= 30 ? 'warn' : ''}">${paid||yrPaid ? '냄' : p.to < today() ? '기간 지남' : dd(p.from)}</span></div>`; }).join('')).join('')}
      <p class="muted">위택스·은행 앱에서 낼 수 있어요. 낸 기간에 체크해두면 다음 납부만 알려줘요.</p></div>
    ${loan.end ? `<div class="panel"><h2>💳 할부</h2><div class="row between"><span>월 ${won(loan.monthly)}원 · 마지막 납입 ${ymd(loan.end)}</span><span class="tag">${loanLeft}개월 남음</span></div></div>` : ''}`}`;
  $('#dedit').onclick = () => { S.edit = ed ? null : {_docs:true}; render(); };
  $$('[data-tax]').forEach(cb => cb.onchange = () => { if (cb.checked) c.tax[cb.dataset.tax] = today(); else delete c.tax[cb.dataset.tax]; save(c); });
  if (ed) { $$('#s_premium,#l_monthly').forEach(x => x.oninput = () => { const n = toNum(x.value); x.value = n ? won(n) : ''; });
    $('#dsave').onclick = () => { const g = id => $('#' + id).value.trim();
      c.info = {name:g('i_name') || '다람이', model:g('i_model'), plate:g('i_plate'), bought:g('i_bought'), tire:g('i_tire'), oil:g('i_oil'), wiper:g('i_wiper'), memo:g('i_memo')};
      c.ins = {company:g('s_company'), end:g('s_end'), premium:toNum(g('s_premium')), phone:g('s_phone'), memo:g('s_memo')};
      c.insp = {expire:g('p_expire'), memo:g('p_memo')}; c.loan = {monthly:toNum(g('l_monthly')), end:g('l_end')};
      S.edit = null; save(c, '저장했어요'); }; }
}

// ----- 비용 -----
function carCats(){ const c = cfg().ledgerCats; if (Array.isArray(c)) return c; const m = S.expCats.filter(x => /차량|자동차|주유|교통/.test(x)); return m.length ? m : S.expCats.slice(0, 0); }
function classify(x){ if (isFuel(x)) return '연료'; for (const [n, re] of COST_RULES) if (re && re.test(x.detail || '')) return n; return '기타'; }
function viewCost(){
  const from = `${S.year}-01-01`, to = `${S.year}-12-31`; loadLedgerOnce(from, to);
  const L = S.ledger && S.ledger.key === from + '|' + to ? S.ledger : null, cats = carCats();
  const rows = L && L.rows ? L.rows.filter(x => cats.includes(x.category) || isFuel(x)) : [];
  const groups = {}; rows.forEach(x => { const g = classify(x); groups[g] = (groups[g]||0) + +x.amount; });
  const total = rows.reduce((a,x) => a + +x.amount, 0);
  const pts = odoPoints().filter(p => p.d >= from && p.d <= to); const dist = pts.length >= 2 ? pts[pts.length-1].km - pts[0].km : 0;
  const ins = cfg().ins; const mine = {fuel: fuels().filter(f => f.date >= from && f.date <= to).reduce((a,f) => a + (+f.amount||0), 0), maint: maints().filter(m => m.date >= from && m.date <= to).reduce((a,m) => a + (+m.cost||0), 0)};
  const order = ['연료','정비','보험·세금','주차·통행료','세차','기타'];
  $('#main').innerHTML = `<div class="row between" style="margin-bottom:14px"><div class="row" style="gap:0"><button class="btn sm" id="yp">◀</button><b style="padding:0 12px">${S.year}년</b><button class="btn sm" id="yn">▶</button></div></div>
    <div class="kpis"><div class="kpi"><div class="l">가계부 차량비 합계</div><div class="v">${L && L.rows ? won(total) : '…'}</div><div class="s">${esc(cats.join('·') || '카테고리 선택 필요')} + 주유 결제</div></div>
      <div class="kpi"><div class="l">달린 거리</div><div class="v">${dist ? won(dist) : '-'} <span style="font-size:13px">km</span></div><div class="s">이 해 기록된 주행거리 기준</div></div>
      <div class="kpi"><div class="l">km당 비용</div><div class="v">${dist && total ? won(total / dist) : '-'} <span style="font-size:13px">원</span></div><div class="s">합계 ÷ 달린 거리</div></div></div>
    <div class="panel"><h2>항목별 <small>가계부 내역을 가맹점 이름으로 나눴어요</small></h2>
      ${!L || !L.rows ? '<div class="muted">불러오는 중…</div>' : total ? order.filter(g => groups[g]).map(g => `<div style="padding:6px 0"><div class="row between"><span>${g}</span><b class="num">${won(groups[g])}원 <span class="muted">${Math.round(groups[g]/total*100)}%</span></b></div>
        <div class="bar" style="margin-top:4px"><i style="width:${groups[g]/total*100}%;background:var(--nut)"></i></div></div>`).join('') : '<div class="muted">이 해에 가져올 차량 지출이 없어요</div>'}
      <div class="muted" style="margin-top:10px">다람이에 적은 기록: 주유 ${won(mine.fuel)}원 · 정비 ${won(mine.maint)}원${ins.premium ? ` · 보험료 ${won(ins.premium)}원(설정값)` : ''}</div></div>
    <div class="panel"><h2>가계부 카테고리 <small>차량비로 셀 카테고리를 고르세요</small></h2>
      <div class="chips">${S.expCats.map(x => `<button class="chip ${cats.includes(x)?'on':''}" data-lc="${esc(x)}">${esc(x)}</button>`).join('') || '<span class="muted">가계부 카테고리가 없어요</span>'}</div></div>
    ${rows.length ? `<div class="panel"><h2>내역 <small>${rows.length}건</small></h2><div class="tbl"><table><tr><th>날짜</th><th>내용</th><th>분류</th><th class="r">금액</th></tr>
      ${rows.sort((a,b) => b.date.localeCompare(a.date)).map(x => `<tr><td class="num">${ymd(x.date)}</td><td class="wrap">${esc(x.detail||'')}</td><td>${classify(x)}</td><td class="r num">${won(x.amount)}</td></tr>`).join('')}</table></div></div>` : ''}`;
  $('#yp').onclick = () => { S.year--; render(); }; $('#yn').onclick = () => { S.year++; render(); };
  $$('[data-lc]').forEach(b => b.onclick = () => { const c = cfg(), cur = carCats(), v = b.dataset.lc; c.ledgerCats = cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v]; save(c); });
}
function loadLedgerOnce(from, to){ if (!S.ledger || S.ledger.key !== from + '|' + to) loadLedger(from, to); }

(async () => {
  if (!sb) { $('#app').innerHTML = `<div class="panel login"><h2>설정이 필요해요</h2><p class="muted">config.js에 Supabase 주소와 키를 넣어주세요.</p></div>`; return; }
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  try { await load(); subscribe(); }
  catch(e){ if (e.message !== 'login' && e.message !== 'setup') $('#app').innerHTML = `<div class="panel login">DB에 연결할 수 없어요: ${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
